services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: rain
      POSTGRES_PASSWORD: rain
      POSTGRES_DB: rain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # schema: python -m app.migrate (backend folder), re-runnable on any volume

volumes:
  pgdata: